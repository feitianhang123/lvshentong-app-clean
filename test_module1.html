<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模块一功能测试</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; padding: 20px; }
        .test-case { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background: #e8f5e8; border-color: #4CAF50; }
        .error { background: #ffebee; border-color: #f44336; }
        .loading { background: #fff3e0; border-color: #ff9800; }
    </style>
</head>
<body>
    <h1>模块一功能测试</h1>
    
    <div class="test-case" id="test1">
        <h3>测试1: JSON加载功能</h3>
        <p>正在测试JSON数据加载...</p>
    </div>
    
    <div class="test-case" id="test2">
        <h3>测试2: 搜索功能 - "肉"</h3>
        <p>正在搜索包含"肉"的产品...</p>
    </div>
    
    <div class="test-case" id="test3">
        <h3>测试3: 搜索功能 - "苹果"</h3>
        <p>正在搜索"苹果"...</p>
    </div>
    
    <div class="test-case" id="test4">
        <h3>测试4: 搜索功能 - "不存在产品"</h3>
        <p>正在搜索"不存在产品"...</p>
    </div>

    <script>
        async function testJSONLoading() {
            const testElement = document.getElementById('test1');
            try {
                const response = await fetch('http://localhost:5001/api/excel-info');
                const data = await response.json();
                
                testElement.innerHTML += `<p><strong>✅ 成功加载!</strong> 共 ${data.row_count} 行数据</p>`;
                testElement.classList.add('success');
            } catch (error) {
                testElement.innerHTML += `<p><strong>❌ 加载失败:</strong> ${error.message}</p>`;
                testElement.classList.add('error');
            }
        }

        async function testSearch(product, testId, expectedCount) {
            const testElement = document.getElementById(testId);
            try {
                const response = await fetch(`http://localhost:5001/api/search?q=${encodeURIComponent(product)}`);
                const data = await response.json();
                
                if (data.success) {
                    testElement.innerHTML += `<p><strong>✅ 搜索成功!</strong> 找到 ${data.count} 个产品</p>`;
                    if (data.count > 0) {
                        data.results.slice(0, 3).forEach(result => {
                            testElement.innerHTML += `<p>• ${result.product} (标准: ${result.standard})</p>`;
                        });
                    }
                    testElement.classList.add('success');
                } else {
                    testElement.innerHTML += `<p><strong>✅ 搜索完成!</strong> 未找到匹配产品</p>`;
                    testElement.classList.add('success');
                }
            } catch (error) {
                testElement.innerHTML += `<p><strong>❌ 搜索失败:</strong> ${error.message}</p>`;
                testElement.classList.add('error');
            }
        }

        // 运行所有测试
        async function runTests() {
            await testJSONLoading();
            await testSearch('肉', 'test2', 'multiple');
            await testSearch('苹果', 'test3', 'atLeastOne');
            await testSearch('不存在产品', 'test4', 'zero');
        }

        runTests();
    </script>
</body>
</html>
