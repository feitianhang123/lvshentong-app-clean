<!DOCTYPE html>
<html>
<head>
    <title>JSON加载测试</title>
    <script>
        async function testJSON() {
            try {
                const response = await fetch('complete_excel.json');
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    `✅ JSON加载成功！共 ${data.length} 行数据`;
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `❌ JSON加载失败: ${error.message}`;
            }
        }
    </script>
</head>
<body>
    <h1>JSON加载测试</h1>
    <button onclick="testJSON()">测试JSON加载</button>
    <div id="result"></div>
</body>
</html>
