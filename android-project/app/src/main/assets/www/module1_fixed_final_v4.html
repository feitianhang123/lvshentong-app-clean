        }
        
        .search-box {
            display: flex;

            margin-bottom: 15px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #4CAF50;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        
        .search-input:focus {
            border-color: #2e7d32;

            background: linear-gradient(135deg, #4CAF50 0%, #2e7d32 100%);

            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;

        }
        
        .search-btn:hover {
            transform: translateY(-2px);

        }
        
        .directory-card {
            background: #f8fff8;
            border: 2px solid #e8f5e8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .directory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .card-subtitle {

            color: #666;
        }

            padding: 20px;
            display: none;
        }

            border: 1px solid #c8e6c9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;

            background: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .product-info {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .directory-view {
            padding: 20px;
            max-height: 600px;
            overflow-y: auto;
            display: none;
        }
        
        .directory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 11px;
        }
        
        .directory-table th,
        .directory-table td {
            border: 1px solid #e0e0e0;
            padding: 4px 6px;
            text-align: left;
        }
        
        .directory-table th {
            background: #f8fff8;
            font-weight: bold;
            color: #2e7d32;
            position: sticky;
            top: 0;
        }
        
        .back-btn {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;

                "水产品": ["鱼", "虾", "蟹", "贝类", "海带"]
            };
            
            for (const [category, products] of Object.entries(categories)) {
                if (products.some(p => productName.includes(p))) {
                    return category;
                }
            }
            
            return "其他";
        }

        // 搜索产品
        function searchProduct() {
            const productName = document.getElementById('productInput').value.trim();

                return;
            }
            
            const resultSection = document.getElementById('resultSection');
            resultSection.style.display = 'block';
            
            // 搜索产品（支持模糊匹配）
            const foundProducts = fullProductData.filter(product => {
                const searchTerm = productName.toLowerCase();
                const productTerm = product.name.toLowerCase();
                return productTerm.includes(searchTerm) || searchTerm.includes(productTerm);
            });
            
            if (foundProducts.length > 0) {
                let resultHTML = '<div class="result-success">';
                resultHTML += `<strong>找到 ${foundProducts.length} 个匹配产品：</strong>`;
                
                foundProducts.forEach(product => {
                    resultHTML += `<div class="product-info">`;
                    resultHTML += `<div class="product-row">产品：${product.name}</div>`;
                    resultHTML += `<div>所在行：第 ${product.rowNumber} 行</div>`;
                    resultHTML += `<div>标准：${product.standard || '暂无标准信息'}</div>`;
                    resultHTML += `<div>说明：${product.description || '暂无说明'}</div>`;
                    resultHTML += `<div>类别：${product.category || '未分类'}</div>`;
                    resultHTML += `</div>`;
                });
                
                resultHTML += '</div>';
                resultSection.innerHTML = resultHTML;

                resultSection.innerHTML = `

                directoryHTML += '<tr>';
                directoryHTML += `<td>${product.rowNumber}</td>`; // A列：序号
                directoryHTML += `<td>${product.standard.replace(/\\n/g, '<br>')}</td>`; // B列：标准名称
                directoryHTML += `<td>${product.name}</td>`; // C列：适用产品名称
                directoryHTML += `<td>${product.description}</td>`; // D列：适用产品名称说明
                directoryHTML += `<td>${product.category}</td>`; // 额外类别列
                directoryHTML += '</tr>';
            });
            
            directoryHTML += '</tbody></table>';
            directoryHTML += `<div style="margin-top: 15px; color: #666;">显示 ${fullProductData.length} 行数据（完整目录，ABCD列一一对应）</div>`;
            
            document.getElementById('directoryContent').innerHTML = directoryHTML;
        }

        // 隐藏目录视图
        function hideDirectory() {
            document.getElementById('directoryView').style.display = 'none';
            document.querySelector('.search-section').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
        }

        // 添加键盘事件支持
        document.getElementById('productInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchProduct();
            }
        });

        // 页面加载完成
        console.log('模块一页面加载完成，包含974行完整产品数据');
        console.log('产品数据总量:', fullProductData.length);
        console.log('ABCD列对应关系：');
        console.log('A列：序号（行号）');
        console.log('B列：标准名称（NY/T285-2021等）');
        console.log('C列：适用产品名称');
        console.log('D列：适用产品名称说明');
    </script>
</body>
</html>
