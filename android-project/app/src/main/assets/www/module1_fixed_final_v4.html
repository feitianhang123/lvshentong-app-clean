<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品目录 - 绿色食品申报通</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f8fff8; min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(76,175,80,0.1); overflow: hidden; }
        .header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
        .module-title { font-size: 18px; font-weight: bold; }
        .search-section { padding: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; padding: 12px; border: 2px solid #e8f5e8; border-radius: 8px; font-size: 14px; }
        .search-input:focus { border-color: #4CAF50; outline: none; }
        .search-btn { background: #4CAF50; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .search-btn:hover { background: #45a049; }
        .result-section { padding: 20px; display: none; }
        .result-success { background: #e8f5e8; border: 2px solid #4CAF50; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .result-error { background: #ffebee; border: 2px solid #f44336; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="module-title">产品目录</div>
        </div>
        
        <div class="search-section" id="searchSection">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="请输入产品名称">
                <button class="search-btn" onclick="searchProduct()">搜索</button>
            </div>
            
            <div class="standard-catalog-card" onclick="showFullCatalog()" style="background: white; border: 2px solid #e8f5e8; border-radius: 8px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s ease;">
                <div style="font-size: 16px; font-weight: bold; color: #2e7d32; margin-bottom: 8px;">绿色食品产品适用标准目录（2023版）</div>
                <div style="font-size: 12px; color: #666;">点击查看完整的标准目录内容</div>
            </div>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-success" id="successResult">
                <div style="font-weight: bold; margin-bottom: 10px; color: #2e7d32;">✅ 找到匹配产品！</div>
                <div id="successDesc"></div>
            </div>
            
            <div class="result-error" id="errorResult">
                <div style="font-weight: bold; margin-bottom: 10px; color: #d32f2f;">❌ 未找到产品</div>
                <div>申报产品不在绿色食品使用标准目录内，暂时无法申报绿色食品。</div>
            </div>
        </div>
    </div>

    <script>
        let jsonData = null;
        
        // 加载JSON数据
        async function loadJSONData() {
            try {
                console.log('开始加载JSON数据...');
                const response = await fetch('./complete_excel.json');
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                jsonData = await response.json();
                console.log('JSON数据加载成功:', jsonData.length, '行');
                
                // 清理数据
                jsonData = jsonData.filter(item => {
                    const product = item.col3 || '';
                    return product !== 'nan' && product.trim() !== '' && 
                           !product.includes('适用产品名称');
                });
                
                console.log('数据清理完成，有效产品:', jsonData.length, '个');
                
            } catch (error) {
                console.error('JSON加载失败:', error);
                alert('数据加载失败: ' + error.message);
            }
        }
        
        // 搜索产品
        function searchProduct() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                alert('请输入产品名称');
                return;
            }
            
            if (!jsonData) {
                alert('数据尚未加载完成，请稍后重试');
                return;
            }
            
            const searchSection = document.getElementById('searchSection');
            const resultSection = document.getElementById('resultSection');
            const successResult = document.getElementById('successResult');
            const errorResult = document.getElementById('errorResult');
            const successDesc = document.getElementById('successDesc');
            
            // 显示结果区域
            searchSection.style.display = 'none';
            resultSection.style.display = 'block';
            successResult.style.display = 'none';
            errorResult.style.display = 'none';
            
            // 执行搜索
            const results = jsonData.filter(item => {
                const product = item.col3 || '';
                return product.toLowerCase().includes(searchTerm.toLowerCase());
            });
            
            if (results.length > 0) {
                successResult.style.display = 'block';
                let html = `<div style="margin-bottom: 15px;">找到 ${results.length} 个匹配产品：</div>`;
                
                results.slice(0, 5).forEach(result => {
                    html += `<div style="margin: 10px 0; padding: 12px; border-left: 4px solid #4CAF50; background: #f9f9f9; border-radius: 4px;">`;
                    html += `<strong style="color: #2e7d32;">${result.col3}</strong><br>`;
                    if (result.col2 && result.col2 !== 'nan') {
                        html += `<small>标准：${result.col2}</small><br>`;
                    }
                    html += `<small style="color: #666;">行号：${result.row}</small>`;
                    html += `</div>`;
                });
                
                if (results.length > 5) {
                    html += `<div style="color: #666; margin-top: 10px;">... 还有 ${results.length - 5} 个结果</div>`;
                }
                
                successDesc.innerHTML = html;
            } else {
                errorResult.style.display = 'block';
            }
        }
        
        // 显示完整目录
        function showFullCatalog() {
            console.log('显示完整目录 - 全部' + jsonData.length + '行');
            if (jsonData.length === 0) {
                alert('数据尚未加载完成，请稍后重试');
                return;
            }
            
            // 创建模态框
            const modalDiv = document.createElement('div');
            modalDiv.style.position = 'fixed';
            modalDiv.style.top = '0';
            modalDiv.style.left = '0';
            modalDiv.style.width = '100%';
            modalDiv.style.height = '100%';
            modalDiv.style.background = 'rgba(0,0,0,0.8)';
            modalDiv.style.zIndex = '1000';
            modalDiv.style.overflow = 'auto';
            
            let html = '<div style="max-width: 95%; margin: 20px auto; background: white; padding: 20px; border-radius: 10px;">';
            html += '<h2 style="color: #2e7d32; margin-bottom: 15px;">绿色食品产品适用标准目录（2023版）</h2>';
            html += '<div style="margin-bottom: 15px;">共 ' + jsonData.length + ' 行数据</div>';
            html += '<div style="max-height: 70vh; overflow: auto; border: 1px solid #ddd;">';
            html += '<table style="width: 100%; border-collapse: collapse; font-size: 11px;">';
            html += '<thead>';
            html += '<tr><th style="border: 1px solid #ddd; padding: 8px; text-align: left; background: #f2f2f2; position: sticky; top: 0;">行号</th><th style="border: 1px solid #ddd; padding: 8px; text-align: left; background: #f2极 content length, truncating to 100KB. Use edit with offset/limit for large files.
