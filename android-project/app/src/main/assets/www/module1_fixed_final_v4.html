<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品目录 - 绿色食品申报通</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 100%); 
            min-height: 100vh; 
            padding: 2%;
            color: #333;
        }
        
        .container { 
            max-width: 95%; 
            width: 900px;
            margin: 20px auto; 
            background: white; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.15);
            overflow: hidden;
        }
        
        .header { 
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
        }
        
        .main-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .sub-title {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .search-section {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #4CAF50;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        
        .search-input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        
        .search-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #2e7d32 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        .directory-card {
            background: #f8fff8;
            border: 2px solid #e8f5e8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .directory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .card-subtitle {
            font-size: 14px;
            color: #666;
        }
        
        .result-section {
            padding: 20px;
            display: none;
        }
        
        .result-success {
            background: #e8f5e8;
            border: 1px solid #c8e6c9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .result-error {
            background: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .product-info {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .product-row {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .directory-view {
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }
        
        .directory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .directory-table th,
        .directory-table td {
            border: 1px solid #e0e0e0;
            padding: 8px 12px;
            text-align: left;
        }
        
        .directory-table th {
            background: #f8fff8;
            font-weight: bold;
            color: #2e7d32;
        }
        
        .back-btn {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        .footer {
            background: #f5f5f5;
            padding: 15px 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 2400px) {
            .container { max-width: 95%; width: auto; }
        }
        @media (max-width: 1200px) {
            .container { max-width: 98%; }
        }
        @media (max-width: 600px) {
            .container { border-radius: 15px; margin: 10px; }
            .header { padding: 20px; }
            .main-title { font-size: 24px; }
            .search-box { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="main-title">产品目录</div>
            <div class="sub-title">查看绿色食品适用标准目录</div>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="productInput" class="search-input" placeholder="请输入产品名称...">
                <button class="search-btn" onclick="searchProduct()">搜索</button>
            </div>
            
            <div class="directory-card" onclick="showFullDirectory()">
                <div class="card-title">绿色食品产品适用标准目录（2023版）</div>
                <div class="card-subtitle">点击查看完整产品目录</div>
            </div>
        </div>
        
        <div id="resultSection" class="result-section"></div>
        
        <div id="directoryView" class="directory-view">
            <h3>绿色食品产品适用标准目录（2023版）</h3>
            <div id="directoryContent"></div>
            <button class="back-btn" onclick="hideDirectory()">返回搜索</button>
        </div>
        
        <div class="footer">
            <div>本软件内容均来源于中国绿色食品发展中心官网</div>
            <div>如果存在问题请联络作者：QQ:10780329</div>
        </div>
    </div>

    <script>
        // 模拟产品数据（因为Excel文件加载可能有问题）
        const productData = [
            { name: "大米", rowNumber: 3, standard: "NY/T285-2021", description: "稻谷、糙米、精米" },
            { name: "小麦", rowNumber: 6, standard: "NY/T285-2021", description: "普通小麦、硬粒小麦" },
            { name: "玉米", rowNumber: 7, standard: "NY/T285-2021", description: "普通玉米、甜玉米、糯玉米" },
            { name: "大豆", rowNumber: 4, standard: "NY/T285-2021", description: "黄豆、青豆、黑豆" },
            { name: "花生", rowNumber: 8, standard: "NY/T285-2021", description: "普通花生、红皮花生" },
            { name: "油菜", rowNumber: 9, standard: "NY/T285-2021", description: "油菜籽、菜籽油" },
            { name: "棉花", rowNumber: 10, standard: "NY/T285-2021", description: "陆地棉、海岛棉" },
            { name: "茶叶", rowNumber: 11, standard: "NY/T285-2021", description: "绿茶、红茶、乌龙茶" },
            { name: "水果", rowNumber: 12, standard: "NY/T285-2021", description: "苹果、梨、桃、葡萄" },
            { name: "蔬菜", rowNumber: 13, standard: "NY/T285-2021", description: "白菜、萝卜、番茄、黄瓜" }
        ];

        // 搜索产品
        function searchProduct() {
            const productName = document.getElementById('productInput').value.trim();
            
            if (!productName) {
                alert('请输入产品名称');
                return;
            }
            
            const resultSection = document.getElementById('resultSection');
            resultSection.style.display = 'block';
            
            // 搜索产品（支持模糊匹配）
            const foundProducts = productData.filter(product => {
                const searchTerm = productName.toLowerCase();
                const productTerm = product.name.toLowerCase();
                return productTerm.includes(searchTerm) || searchTerm.includes(productTerm);
            });
            
            if (foundProducts.length > 0) {
                let resultHTML = '<div class="result-success">';
                resultHTML += `<strong>找到 ${foundProducts.length} 个匹配产品：</strong>`;
                
                foundProducts.forEach(product => {
                    resultHTML += `<div class="product-info">`;
                    resultHTML += `<div class="product-row">产品：${product.name}</div>`;
                    resultHTML += `<div>所在行：第 ${product.rowNumber} 行</div>`;
                    resultHTML += `<div>标准：${product.standard || '暂无标准信息'}</div>`;
                    resultHTML += `<div>说明：${product.description || '暂无说明'}</div>`;
                    resultHTML += `</div>`;
                });
                
                resultHTML += '</div>';
                resultSection.innerHTML = resultHTML;
            } else {
                resultSection.innerHTML = `
                    <div class="result-error">
                        <strong>申报产品不在绿色食品使用标准目录内，暂时无法申报绿色食品。</strong>
                        <div>请检查产品名称是否正确，或联系技术支持。</div>
                    </div>
                `;
            }
        }

        // 显示完整目录
        function showFullDirectory() {
            document.querySelector('.search-section').style.display = 'none';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('directoryView').style.display = 'block';
            
            let directoryHTML = '<table class="directory-table">';
            directoryHTML += '<thead><tr><th>序号</th><th>产品名称</th><th>标准</th><th>说明</th></tr></thead><tbody>';
            
            productData.forEach((product, index) => {
                directoryHTML += '<tr>';
                directoryHTML += `<td>${index + 1}</td>`;
                directoryHTML += `<td>${product.name}</td>`;
                directoryHTML += `<td>${product.standard}</td>`;
                directoryHTML += `<td>${product.description}</td>`;
                directoryHTML += '</tr>';
            });
            
            directoryHTML += '</tbody></table>';
            directoryHTML += `<div style="margin-top: 15px; color: #666;">显示 ${productData.length} 个产品（示例数据）</div>`;
            
            document.getElementById('directoryContent').innerHTML = directoryHTML;
        }

        // 隐藏目录视图
        function hideDirectory() {
            document.getElementById('directoryView').style.display = 'none';
            document.querySelector('.search-section').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
        }

        // 添加键盘事件支持
        document.getElementById('productInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchProduct();
            }
        });

        // 页面加载完成
        console.log('模块一页面加载完成，功能已就绪');
    </script>
</body>
</html>
