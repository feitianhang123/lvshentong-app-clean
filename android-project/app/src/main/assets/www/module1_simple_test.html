<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>模块一简单测试</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { margin: 10px; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>模块一简单测试</h1>
    
    <div class="test">
        <h2>1. 基本HTML显示测试</h2>
        <p>如果这个文本可见，说明HTML渲染正常。</p>
    </div>
    
    <div class="test">
        <h2>2. JavaScript测试</h2>
        <button onclick="testJS()">测试JavaScript</button>
        <div id="jsResult"></div>
    </div>
    
    <div class="test">
        <h2>3. JSON加载测试</h2>
        <button onclick="testJSON()">测试JSON加载</button>
        <div id="jsonResult"></div>
    </div>
    
    <script>
        function testJS() {
            document.getElementById('jsResult').innerHTML = '✅ JavaScript正常工作';
            console.log('JavaScript测试通过');
        }
        
        function testJSON() {
            console.log('开始JSON加载测试...');
            fetch('./complete_excel.json')
                .then(response => {
                    console.log('响应状态:', response.status);
                    if (!response.ok) throw new Error('HTTP错误: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('JSON加载成功:', data.length, '行');
                    document.getElementById('jsonResult').innerHTML = 
                        '✅ JSON加载成功: ' + data.length + '行数据';
                })
                .catch(error => {
                    console.error('JSON加载失败:', error);
                    document.getElementById('jsonResult').innerHTML = 
                        '❌ JSON加载失败: ' + error.message;
                });
        }
        
        // 页面加载时自动测试
        document.addEventListener('DOMContentLoaded', function() {
            console.log('简单测试页面加载完成');
            document.getElementById('jsResult').innerHTML = '✅ DOM加载完成';
        });
    </script>
</body>
</html>
