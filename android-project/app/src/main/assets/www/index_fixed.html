<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>绿色食品申报通</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }

        

        body {

            font-family: 'Microsoft YaHei', sans-serif;

            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 100%);

            min-height: 100vh;

            padding: 20px;

            color: #333;

        }

        

        .container {

            max-width: 400px;

            margin: 0 auto;

            background: white;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.15);

            overflow: hidden;

        }

        

        .header {

            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);

            color: white;

            padding: 30px 20px;

            text-align: center;

        }

        

        .main-title {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 8px;

        }

        

        .sub-title {

            font-size: 14px;

            opacity: 0.9;

        }

        

        .modules {

            padding: 20px;

        }

        

        .module-card {

            background: #f8fff8;

            border: 2px solid #e8f5e8;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 15px;

            cursor: pointer;

            transition: all 0.3s ease;

        }

        

        .module-card:hover {

            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);

            border-color: #4CAF50;

        }

        

        .module-title {

            font-size: 18px;

            font-weight: bold;

            color: #2e7d32;

            margin-bottom: 5px;

        }

        

        .module-desc {

            font-size: 12px;

            color: #666;

        }

        

        .module-badge {

            background: #ff9800;

            color: white;

            padding: 2px 8px;

            border-radius: 10px;

            font-size: 10px;

            margin-left: 8px;

        }

        

        .footer {

            background: #f5f5f5;

            padding: 15px 20px;

            text-align: center;

            font-size: 12px;

            color: #666;

            border-top: 1px solid #eee;

        }

        

        .footer a {

            color: #4CAF50;

            text-decoration: none;

        }

        

        .footer a:hover {

            text-decoration: underline;

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <div class="main-title">绿色食品申报通</div>

            <div class="sub-title">一站式标准查询和申报助手</div>

        </div>

        

        <div class="modules">

            <div class="module-card" onclick="location.href='module1_fixed_final_v4.html'">

                <div class="module-title">

                    产品标准查询

                    <span class="module-badge">开发中</span>

                </div>

                <div class="module-desc">智能搜索绿色食品产品标准目录</div>

            </div>

            

            <div class="module-card" onclick="location.href='module2_current_standards.html'">

                <div class="module-title">现行标准查询</div>

                <div class="module-desc">完整的143个绿色食品标准数据库</div>

            </div>

            

            <div class="module-card" onclick="location.href='module3_final.html'">

                <div class="module-title">材料清单</div>

                <div class="module-desc">各类产品申报材料清单和下载</div>

            </div>

            

            <div class="module-card" onclick="location.href='module4_coming_soon.html'">

                <div class="module-title">

                    标准修订追踪

                    <span class="module-badge">规划中</span>

                </div>

                <div class="module-desc">绿色食品标准修订历史追踪功能</div>

            </div>

        </div>

        

        <div class="footer">

            <div>数据来源：中国绿色食品发展中心</div>

            <div>版本：115 - 稳定版本（模块四预留）</div>

        </div>

    </div>

</body>

</html>
