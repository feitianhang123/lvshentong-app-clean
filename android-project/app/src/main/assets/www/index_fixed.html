            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 100%);

        .container {

        .main-title {

        }

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 15px;

            cursor: pointer;

            transition: all 0.3s ease;

        }

        

        .module-card:hover {

            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);

            border-color: #4CAF50;

        }

        

        .module-title {

            font-size: 18px;

            color: #2e7d32;

            margin-bottom: 5px;

        }

            background: #ff9800;

            padding: 2px 8px;

        .footer {

            background: #f5f5f5;

            padding: 15px 20px;

            text-align: center;

            font-size: 12px;

            color: #666;

            border-top: 1px solid #eee;

        }

        

        .footer a {

            color: #4CAF50;

            text-decoration: none;

        }

        

        .footer a:hover {

            text-decoration: underline;

        }

    </style>

</head>
