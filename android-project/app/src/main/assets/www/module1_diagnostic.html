<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>模块一诊断页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 3px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>模块一功能诊断</h1>
    
    <div class="test-section">
        <h2>1. JSON文件加载测试</h2>
        <button onclick="testJSONLoad()">测试JSON加载</button>
        <div id="jsonResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. DOM元素检查</h2>
        <button onclick="checkDOMElements()">检查DOM元素</button>
        <div id="domResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 事件监听器测试</h2>
        <button onclick="testEventListeners()">测试事件监听</button>
        <div id="eventResult" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. 搜索功能测试</h2>
        <input type="text" id="testSearchInput" placeholder="输入搜索关键词">
        <button onclick="testSearch()">测试搜索</button>
        <div id="searchResult" class="result"></div>
    </div>
    
    <script>
        let excelData = [];
        
        // 测试JSON加载
        function testJSONLoad() {
            console.log('开始测试JSON加载...');
            const resultDiv = document.getElementById('jsonResult');
            resultDiv.innerHTML = '测试中...';
            
            fetch('file:///android_asset/www/complete_excel.json')
                .then(response => {
                    console.log('响应状态:', response.status, response.statusText);
                    console.log('响应头:', response.headers);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status} ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    excelData = data;
                    console.log('JSON加载成功:', data.length, '行数据');
                    resultDiv.innerHTML = 
                        `<span class="success">✅ JSON加载成功!</span><br>` +
                        `数据行数: ${data.length}<br>` +
                        `文件预览: ${JSON.stringify(data[0])}...`;
                })
                .catch(error => {
                    console.error('JSON加载失败:', error);
                    resultDiv.innerHTML = 
                        `<span class="error">❌ JSON加载失败</span><br>` +
                        `错误信息: ${error.message}<br>` +
                        `请检查文件路径和权限`;
                });
        }
        
        // 检查DOM元素
        function checkDOMElements() {
            console.log('检查DOM元素...');
            const resultDiv = document.getElementById('domResult');
            const elements = ['searchBtn', 'dataCard', 'searchInput', 'backBtn'];
            let results = [];
            
            elements.forEach(id => {
                const element = document.getElementById(id);
                results.push(`${id}: ${element ? '✅ 存在' : '❌ 不存在'}`);
                console.log(`${id}:`, element);
            });
            
            resultDiv.innerHTML = results.join('<br>');
        }
        
        // 测试事件监听器
        function testEventListeners() {
            console.log('测试事件监听器...');
            const resultDiv = document.getElementById('eventResult');
            
            // 临时添加测试监听器
            document.getElementById('searchBtn')?.addEventListener('click', function() {
                console.log('搜索按钮点击事件触发');
                resultDiv.innerHTML += '<br>搜索按钮点击事件已触发';
            });
            
            document.getElementById('dataCard')?.addEventListener('click', function() {
                console.log('目录卡点击事件触发');
                resultDiv.innerHTML += '<br>目录卡点击事件已触发';
            });
            
            resultDiv.innerHTML = '事件监听器已添加，请点击相应元素测试';
        }
        
        // 测试搜索功能
        function testSearch() {
            console.log('测试搜索功能...');
            const searchTerm = document.getElementById('testSearchInput').value.trim();
            const resultDiv = document.getElementById('searchResult');
            
            if (!searchTerm) {
                resultDiv.innerHTML = '<span class="error">请输入搜索关键词</span>';
                return;
            }
            
            if (excelData.length === 0) {
                resultDiv.innerHTML = '<span class="error">请先加载JSON数据</span>';
                return;
            }
            
            const foundRows = excelData.filter(row =>
                (row.col1 && row.col1.includes(searchTerm)) ||
                (row.col2 && row.col2.includes(searchTerm)) ||
                (row.col3 && row.col3.includes(searchTerm)) ||
                (row.col4 && row.col4.includes(searchTerm))
            );
            
            console.log('搜索结果:', foundRows.length, '条');
            resultDiv.innerHTML = 
                `<span class="success">✅ 搜索完成!</span><br>` +
                `找到 ${foundRows.length} 条结果<br>` +
                `预览: ${JSON.stringify(foundRows.slice(0, 2))}`;
        }
        
        // 页面加载时自动测试JSON加载
        document.addEventListener('DOMContentLoaded', function() {
            console.log('诊断页面加载完成');
            testJSONLoad();
        });
    </script>
</body>
</html>
