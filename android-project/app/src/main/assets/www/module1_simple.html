<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色食品申报通</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 400px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(76,175,80,0.15); overflow: hidden; }
        .header { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; padding: 30px; text-align: center; }
        .app-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .app-subtitle { font-size: 14px; opacity: 0.9; }
        .modules { padding: 20px; }
        .module-card { background: white; border: 2px solid #e8f5e8; border-radius: 15px; padding: 20px; margin-bottom: 15px; cursor: pointer; transition: all 0.3s ease; }
        .module-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76,175,80,0.2); border-color: #4CAF50; }
        .module-title { font-size: 18px; font-weight: bold; color: #2e7d32; margin-bottom: 8px; }
        .module-desc { font-size: 14px; color: #666; }
        .footer { text-align: center; padding: 20px; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="app-title">绿色食品申报通</div>
            <div class="app-subtitle">一站式绿色食品申报服务平台</div>
        </div>
        
        <div class="modules">
            <div class="module-card" onclick="loadModule('module1')">
                <div class="module-title">📋 产品目录查询</div>
                <div class="module-desc">查询绿色食品适用标准目录，快速确认产品是否符合申报条件</div>
            </div>
            
            <div class="module-card" onclick="loadModule('module2')">
                <div class="module-title">📄 文档下载</div>
                <div class="module-desc">下载申报所需的各种文档模板和表格文件</div>
            </div>
            
            <div class="module-card" onclick="loadModule('module3')">
                <div class="module-title">📖 申报指南</div>
                <div class="module-desc">查看详细的申报流程、要求和注意事项</div>
            </div>
        </div>
        
        <div class="footer">
            绿色食品申报通 © 2026 | 技术支持
        </div>
    </div>

    <script>
        function loadModule(module) {
            switch(module) {
                case 'module1':
                    window.location.href = 'module1_fixed_final_v4.html';
                    break;
                case 'module2':
                    window.location.href = 'module2.html';
                    break;
                case 'module3':
                    window.location.href = 'module3_final.html';
                    break;
            }
        }
        
        // 页面加载完成时显示欢迎信息
        window.onload = function() {
            console.log('绿色食品申报通主页面加载完成');
            console.log('可用模块: 产品目录查询、文档下载、申报指南');
        };
    </script>
</body>
</html>
