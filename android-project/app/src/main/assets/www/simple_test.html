<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>简单测试页面</title>
</head>
<body>
    <h1>测试页面加载成功！</h1>
    <p>如果这个页面能显示，说明WebView基本配置正常。</p>
    <p>当前时间: <span id="time"></span></p>
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString();
    </script>
</body>
</html>
