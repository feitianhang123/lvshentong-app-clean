<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品目录 - 绿色食品申报通 v95</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#f8fff8 0%,#e8f5e8 100%);min-height:100vh;padding:0;margin:0;color:#333;display:flex;flex-direction:column;}
        .header{background:linear-gradient(135deg,#4caf50 0%,#2e7d32 100%);color:white;padding:40px 20px;text-align:center;height:120px;display:flex;flex-direction:column;justify-content:center;position:fixed;top:0;left:0;right:0;z-index:1000;}
        .main-title{font-size:28px;font-weight:bold;margin-bottom:8px;}
        .sub-title{font-size:16px;opacity:0.9;}
        .content-section{flex:1;padding:20px;background:#f8f9fa;height:calc(100vh-240px);overflow-y:auto;margin-top:120px;margin-bottom:60px;}
        .search-box{display:flex;gap:10px;margin-bottom:15px;}
        .search-input{flex:1;padding:12px 15px;border:2px solid #4CAF50;border-radius:25px;font-size:16px;outline:none;}
        .search-input:focus{border-color:#2e7d32;box-shadow:0 0 0 3px rgba(76,175,80,0.1);}
        .search-btn{background:linear-gradient(135deg,#4CAF50 0%,#2e7d32 100%);color:white;border:none;border-radius:25px;padding:12px 20px;cursor:pointer;font-size:16px;transition:all .3s;}
        .search-btn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(76,175,80,0.3);}
        .directory-card{background:#f8fff8;border:2px solid #e8f5e8;border-radius:15px;padding:30px;margin-bottom:15px;cursor:pointer;transition:all .3s ease;}
        .directory-card:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(76,175,80,0.2);border-color:#4CAF70;}
        .card-title{font-size:18px;font-weight:bold;color:#2e7d32;margin-bottom:5px;}
        .card-subtitle{font-size:14px;color:#666;}
        .directory-view{padding:20px;display:none;background:white;border-radius:15px;margin-top:15px;}
        .directory-table{width:100%;border-collapse:collapse;margin-top:15px;font-size:11px;}
        .directory-table th,.directory-table td{border:1px solid #e0e0e0;padding:6px 8px;text-align:left;}
        .directory-table th{background:#f0f8f0;font-weight:bold;}
        .back-btn{background:linear-gradient(135deg,#4CAF50 0%,#2e7d32 100%);color:white;padding:10px 20px;border:none;border-radius:20px;cursor:pointer;margin-top:15px;font-size:14px;}
        .result-section{margin-top:15px;}
        .result-item{background:#e8f5e8;border:1px solid #c8e6c9;border-radius:10px;padding:15px;margin-bottom:15px;}
        .result-error{background:#ffebee;border:1px solid #ffcdd2;border-radius:10px;padding:15px;text-align:center;}
        .footer{background:#f5f5f5;color:#666;padding:15px 20px;text-align:center;font-size:12px;height:60px;display:flex;align-items:center;justify-content:center;border-top:1px solid #e0e0e0;position:fixed;bottom:0;left:0;right:0;}
    </style>
</head>
<body>
<div class="header">
    <div class="main-title">绿色食品产品适用标准目录</div>
    <div class="sub-title">2023版</div>
</div>
<div class="content-section">
    <div class="search-box">
        <input type="text" id="productInput" class="search-input" placeholder="请输入产品名称...">
        <button id="searchBtn" class="search-btn" onclick="searchProduct()" disabled>搜索</button>
    </div>
    <div class="directory-card" onclick="showFullDirectory()">
        <div class="card-title">绿色食品产品适用标准目录（2023版）</div>
        <div class="card-subtitle">点击查看完整产品目录</div>
    </div>
    <div id="resultSection" class="result-section"></div>
    <div id="directoryView" class="directory-view">
        <h3>绿色食品产品适用标准目录（2023版）</h3>
        <div id="directoryContent"></div>
        <button class="back-btn" onclick="hideDirectory()">返回搜索</button>
    </div>
</div>
<div class="footer">
    本软件内容均来源于中国绿色食品发展中心官网<br>
    如果存在问题请联络作者：QQ:10780329
</div>
<script>
        // 异步加载完整Excel数据（complete_excel.json）
        let fullExcelData = null;
        let dataLoaded = false;
        function loadData(){
            fetch('complete_excel.json')
                .then(r=>r.json())
                .then(d=>{
                    fullExcelData = d.map(row => [
                        row.col1 || '',
                        row.col2 || '',
                        row.col3 || '',
                        row.col4 || ''
                    ]);
                    dataLoaded = true;
                    console.log('完整数据加载成功，行数:', fullExcelData.length);
                    const btn = document.getElementById('searchBtn');
                    if(btn) btn.disabled = false;
                })
                .catch(e=>{
                    console.error('加载完整数据失败', e);
                    fullExcelData = [];
                    dataLoaded = true;
                });
        }
        loadData();

        // 搜索产品函数（基于完整数据）
        function searchProduct(){
            const input = document.getElementById('productInput');
            if(!input){ alert('输入框未找到'); return; }
            const productName = input.value.trim();
            if(!productName){ alert('请输入产品名称'); return; }
            const resultSection = document.getElementById('resultSection');
            const directoryView = document.getElementById('directoryView');
            if(directoryView) directoryView.style.display = 'none';
            resultSection.style.display = 'block';
            if(!dataLoaded){
                resultSection.innerHTML = '<div class="result-error">数据尚未加载，请稍后再试。</div>';
                return;
            }
            const searchTerm = productName.toLowerCase();
            const found = [];
            for(let i=0;i<fullExcelData.length;i++){
                const row = fullExcelData[i];
                if(!row) continue;
                for(let j=0;j<row.length;j++){
                    const cell = row[j];
                    if(cell && cell.toString().toLowerCase().includes(searchTerm)){
                        let standard='';
                        for(let k=i;k>=0;k--){
                            const stdRow = fullExcelData[k];
                            if(stdRow && stdRow[1]){standard = stdRow[1]; break;}
                        }
                        found.push({
                            name: row[2] || row[0] || row[1] || row[3] || cell,
                            rowNumber: i+1,
                            standard: standard || '未找到标准',
                            description: row[3] || ''
                        });
                        break;
                    }
                }
            }
            if(found.length>0){
                let html='';
                found.forEach(p=>{
                    html+=`<div class="result-item"><div style="font-weight:bold;color:#2e7d32;">第 ${p.rowNumber} 行：${p.name}</div><div>适用标准：${p.standard}</div><div>${p.description}</div></div>`;
                });
                resultSection.innerHTML = html;
            } else {
                resultSection.innerHTML = '<div class="result-error">申报产品不在绿色食品使用标准目录内</div>';
            }
        }

        // 显示完整目录表格（等待数据加载）
        function showFullDirectory(){
            const directoryView = document.getElementById('directoryView');
            const resultSection = document.getElementById('resultSection');
            const directoryContent = document.getElementById('directoryContent');
            if(resultSection) resultSection.style.display = 'none';
            if(!directoryView || !directoryContent) return;
            if(!dataLoaded){
                directoryContent.innerHTML = '<div class="result-error">数据尚未加载，请稍后再试。</div>';
                directoryView.style.display = 'block';
                return;
            }
            directoryView.style.display = 'block';
            let tableHTML = '<table class="directory-table"><thead><tr><th>序号</th><th>标准名称</th><th>适用产品名称</th><th>适用产品别名及说明</th></tr></thead><tbody>';
            fullExcelData.forEach(row=>{
                tableHTML += '<tr>' + row.map(cell=>`<td>${cell}</td>`).join('') + '</tr>';
            });
            tableHTML += '</tbody></table>';
            directoryContent.innerHTML = tableHTML;
        }

        function hideDirectory(){
            const directoryView = document.getElementById('directoryView');
            if(directoryView) directoryView.style.display = 'none';
        }

        console.log('页面脚本初始化完成');
</script>
</body>
</html>
