<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色食品产品适用标准目录（恢复版）</title>
    <style>
        body {font-family: Arial, sans-serif; padding:20px;}
        .search-box {margin-bottom:10px;}
        .search-input {width:70%; padding:5px;}
        .search-btn {padding:5px 10px;}
        .directory-card {border:1px solid #4CAF50; padding:10px; margin:10px 0; cursor:pointer;}
        .directory-view {display:none; margin-top:10px;}
        .result-item {border:1px solid #ccc; padding:8px; margin-top:5px;}
        .result-error {color:red;}
        table {width:100%; border-collapse:collapse;}
        th, td {border:1px solid #ddd; padding:4px;}
    </style>
</head>
<body>
    <h2>绿色食品产品适用标准目录</h2>
    <div class="search-box">
        <input type="text" id="productInput" class="search-input" placeholder="请输入产品名称..." />
        <button class="search-btn" onclick="searchProduct()">搜索</button>
    </div>
    <div class="directory-card" onclick="showFullDirectory()">
        <strong>绿色食品产品适用标准目录（2023版）</strong><br/>点击查看完整目录
    </div>
    <div id="resultSection"></div>
    <div id="directoryView" class="directory-view">
        <h3>完整目录</h3>
        <div id="directoryContent"></div>
        <button onclick="hideDirectory()">返回搜索</button>
    </div>
    <script>
        // 简化的示例数据，仅用于演示功能
        const fullExcelData = [
            ["序号", "标准名称", "适用产品名称", "适用产品别名及说明"],
            ["1", "绿色食品豆类\nNY/T285-2021", "大豆", "黄豆、黑豆、青豆等"],
            ["2", "绿色食品茶叶\nNY/T288-2018", "绿茶", "各种绿茶及花茶"],
            ["27", "绿色食品温带水果\nNY/T844-2017", "苹果", "各类苹果"],
            ["28", "绿色食品大麦及大麦粉\nNY/T891-2014", "啤酒大麦", "用于酿造啤酒的麦芽"]
        ];
        function searchProduct(){
            const input = document.getElementById('productInput');
            if(!input){alert('输入框未找到');return;}
            const term = input.value.trim().toLowerCase();
            const result = document.getElementById('resultSection');
            const dir = document.getElementById('directoryView');
            if(dir) dir.style.display='none';
            result.innerHTML='';
            if(!term){result.innerHTML='<div class="result-error">请输入产品名称</div>';return;}
            const found=[];
            for(let i=0;i<fullExcelData.length;i++){
                const row = fullExcelData[i];
                for(let j=0;j<row.length;j++){
                    const cell = row[j];
                    if(cell && cell.toString().toLowerCase().includes(term)){
                        let standard='';
                        for(let k=i;k>=0;k--){
                            if(fullExcelData[k][1]){standard=fullExcelData[k][1];break;}
                        }
                        found.push({name: row[2]||cell, rowNumber:i+1, standard:standard||'未找到标准', description: row[3]||''});
                        break;
                    }
                }
            }
            if(found.length){
                found.forEach(p=>{
                    const div=document.createElement('div');
                    div.className='result-item';
                    div.innerHTML=`<strong>第 ${p.rowNumber} 行：${p.name}</strong><br/>适用标准：${p.standard}<br/>${p.description}`;
                    result.appendChild(div);
                });
            } else {
                result.innerHTML='<div class="result-error">未找到匹配的产品</div>';
            }
        }
        function showFullDirectory(){
            const dir=document.getElementById('directoryView');
            const result=document.getElementById('resultSection');
            const content=document.getElementById('directoryContent');
            if(result) result.style.display='none';
            if(!dir) return;
            dir.style.display='block';
            let html='<table><thead><tr><th>序号</th><th>标准名称</th><th>适用产品名称</th><th>适用产品别名及说明</th></tr></thead><tbody>';
            fullExcelData.forEach(row=>{html+='<tr>'+row.map(c=>`<td>${c}</td>`).join('')+'</tr>';});
            html+='</tbody></table>';
            content.innerHTML=html;
        }
        function hideDirectory(){
            const dir=document.getElementById('directoryView');
            if(dir) dir.style.display='none';
        }
    </script>
</body>
</html>
