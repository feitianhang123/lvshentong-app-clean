name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Prepare Web App
      run: |
        echo "准备Web应用文件..."
        mkdir -p _site
        
        # 复制所有HTML文件
        cp *.html _site/ 2>/dev/null || true
        cp *.js _site/ 2>/dev/null || true
        cp *.json _site/ 2>/dev/null || true
        
        # 确保有主页
        if [ ! -f "_site/index.html" ]; then
          cat > _site/index.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色食品申报通</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #388e3c; text-align: center; }
        .module { background: #e8f5e8; margin: 10px 0; padding: 15px; border-radius: 5px; cursor: pointer; }
        .module:hover { background: #c8e6c9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 绿色食品申报通</h1>
        <div class="module" onclick="location.href='module1-complete.html'">
            <h3>📋 产品标准查询</h3>
            <p>智能搜索绿色食品产品标准</p>
        </div>
        <div class="module" onclick="location.href='module2_current_standards.html'">
            <h3>📊 现行标准查询</h3>
            <p>143个绿色食品标准库</p>
        </div>
        <div class="module" onclick="location.href='module3_final.html'">
            <h3>📝 材料清单</h3>
            <p>申报材料清单和下载</p>
        </div>
        <p style="text-align: center; margin-top: 20px; color: #666;">版本: 118 - 最新版本</p>
        <p style="text-align: center; color: #666;">GitHub Pages部署</p>
    </div>
</body>
</html>
EOF
        fi
        
        echo "Web应用准备完成"
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4