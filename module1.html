<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浜у搧鐩綍 - 缁胯壊椋熷搧鐢虫姤閫?/title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f8fff8 0%, #e8f5e8 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.15);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .back-btn {
            position: absolute;
            left: 15px;
            top: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        
        .module-title {
            font-size: 20px;
            font-weight: bold;
        }
        
        .search-section {
            padding: 20px;
            background: #f8fff8;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e8f5e8;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        .search-input:focus {
            border-color: #4CAF50;
        }
        
        .search-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        
        .search-btn:hover {
            background: #45a049;
        }
        
        .standard-card {
            background: white;
            border: 2px solid #e8f5e8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .standard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 8px;
        }
        
        .card-desc {
            font-size: 12px;
            color: #666;
        }
        
        .result-section {
            padding: 20px;
            display: none;
        }
        
        .result-success {
            background: #e8f5e8;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .result-error {
            background: #ffebee;
            border: 2px solid #f44336;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .result-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #2e7d32;
        }
        
        .result-desc {
            font-size: 14px;
            color: #666;
        }
        
        .back-to-search {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="history.back()">鈫?/button>
            <div class="module-title">浜у搧鐩綍</div>
        </div>
        
        <div class="search-section" id="searchSection">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" 
                       placeholder="璇疯緭鍏ヤ骇鍝佸悕绉?..">
                <button class="search-btn" onclick="searchProduct()">鎼滅储</button>
            </div>
            
            <div class="standard-card" onclick="showStandardContent()">
                <div class="card-title">缁胯壊椋熷搧浜у搧閫傜敤鏍囧噯鐩綍锛?023鐗堬級</div>
                <div class="card-desc">鐐瑰嚮鏌ョ湅瀹屾暣鐨勬爣鍑嗙洰褰曞唴瀹?/div>
            </div>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="result-success" id="successResult">
                <div class="result-title">鉁?鎵惧埌鍖归厤浜у搧锛?/div>
    <script src="module1_fixed.js"></script>
</body>
</html>
