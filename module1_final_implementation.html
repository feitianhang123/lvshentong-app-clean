<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色食品申报通 - 产品目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .search-section {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }
        
        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
        }
        
        .catalog-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border-left: 6px solid #43a047;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .catalog-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.2);
        }
        
        .catalog-card h3 {
            color: #1b5e20;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .catalog-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .result-section {
            padding: 30px;
            min-height: 200px;
        }
        
        .no-result {
            text-align: center;
            color: #666;
            padding: 40px 0;
        }
        
        .product-found {
            background: #e8f5e8;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #43a047;
        }
        
        .product-not-found {
            background: #ffe6e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #d63384;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .product-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .error-message {
            background: #ffe6e6;
            color: #d63384;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #d63384;
            margin-bottom: 20px;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #eee;
        }
        
        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }
            
            .search-btn {
                width: 100%;
            }
            
            .container {
                margin: 10px;
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 绿色食品申报通</h1>
            <p>模块一 - 产品适用标准目录查询</p>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" 
                       placeholder="输入产品名称（如：大米、苹果、大豆、猪肉...）" 
                       onkeypress="if(event.key==='Enter') searchProduct()">
                <button class="search-btn" onclick="searchProduct()">
                    🔍 搜索产品
                </button>
            </div>
            
            <div id="errorContainer"></div>
        </div>
        
        <div class="catalog-card" onclick="showCatalogDetails()">
            <h3>绿色食品产品适用标准目录（2023版）</h3>
            <p>点击查看完整的绿色食品产品适用标准目录内容</p>
        </div>
        
        <div class="result-section" id="resultContainer">
            <div class="no-result">
                <p>请输入产品名称开始搜索</p>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2026 绿色食品申报通 - 版本 1.0</p>
        </div>
    </div>

    <script>
        // 产品数据库 - 基于Excel文件内容的示例数据
        const productDatabase = [
            { name: "大豆", row: 3, standard: "NY/T 285-2021", category: "粮食作物", aliases: ["黄豆", "毛豆", "青豆"] },
            { name: "绿豆", row: 4, standard: "NY/T 285-2021", category: "粮食作物", aliases: ["青小豆", "植豆"] },
            { name: "豇豆", row: 5, standard: "NY/T 285-2021", category: "粮食作物", aliases: ["长豆角", "角豆"] },
            { name: "小麦", row: 6, standard: "NY/T 285-2021", category: "粮食作物", aliases: ["麦子", "普通小麦"] },
            { name: "苹果", row: 32, standard: "NY/T 844-2020", category: "水果", aliases: ["红富士", "青苹果", "蛇果"] },
            { name: "梨", row: 33, standard: "NY/T 844-2020", category: "水果", aliases: ["雪梨", "鸭梨", "香梨"] },
            { name: "桃", row: 34, standard: "NY/T 844-2020", category: "水果", aliases: ["桃子", "水蜜桃", "蟠桃"] },
            { name: "猪肉", row: 67, standard: "NY/T 2799-2021", category: "畜禽产品", aliases: ["猪瘦肉", "猪五花", "猪排"] },
            { name: "牛肉", row: 63, standard: "NY/T 2798-2021", category: "畜禽产品", aliases: ["黄牛肉", "水牛肉", "牛排"] },
            { name: "鸡蛋", row: 72, standard: "NY/T 754-2020", category: "禽蛋", aliases: ["鲜蛋", "土鸡蛋", "洋鸡蛋"] },
            { name: "牛奶", row: 78, standard: "NY/T 1172-2021", category: "乳制品", aliases: ["鲜奶", "纯牛奶", "巴氏奶"] },
            { name: "蜂蜜", row: 85, standard: "NY/T 752-2020", category: "蜂产品", aliases: ["蜂糖", "蜜糖", "蜂王浆"] },
            { name: "对虾", row: 92, standard: "NY/T 1712-2021", category: "水产品", aliases: ["明虾", "基围虾", "斑节虾"] },
            { name: "鲤鱼", row: 96, standard: "NY/T 1711-2021", category: "水产品", aliases: ["黄河鲤", "荷包鲤", "红鲤"] },
            { name: "香菇", row: 105, standard: "NY/T 749-2020", category: "食用菌", aliases: ["冬菇", "花菇", "香蕈"] }
        ];

        // 搜索功能
        function searchProduct() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const errorContainer = document.getElementById('errorContainer');
            
            // 清空之前的错误信息和结果
            errorContainer.innerHTML = '';
            
            if (!searchTerm) {
                showError('请输入产品名称');
                return;
            }
            
            // 搜索产品（支持别名搜索）
            const results = productDatabase.filter(product => 
                product.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                product.aliases.some(alias => 
                    alias.toLowerCase().includes(searchTerm.toLowerCase())
                )
            );
            
            if (results.length === 0) {
                resultContainer.innerHTML = `
                    <div class="product-not-found">
                        <div class="product-name">未找到相关产品</div>
                        <div class="product-info">
                            <p>未找到与"${searchTerm}"相关的产品</p>
                            <p>申报产品不在绿色食品使用标准目录内，暂时无法申报绿色食品。</p>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="download-btn" onclick="showCatalogDetails()">
                            📥 查看完整标准目录
                        </button>
                    </div>
                `;
            } else {
                displayResults(results, searchTerm);
            }
        }

        // 显示搜索结果
        function displayResults(products, searchTerm) {
            const resultContainer = document.getElementById('resultContainer');
            
            let html = '<div style="margin-bottom: 20px;">';
            html += `<p style="color: #666; margin-bottom: 15px;">找到 ${products.length} 个匹配"${searchTerm}"的结果：</p>`;
            
            products.forEach(product => {
                html += `
                    <div class="product-found">
                        <div class="product-name">${product.name}</div>
                        <div class="product-info">
                            <div>类别：${product.category}</div>
                            <div>执行标准：${product.standard}</div>
                            <div>Excel行号：第 ${product.row} 行</div>
                            ${product.aliases.length > 0 ? 
                                `<div>别名：${product.aliases.join('、')}</div>` : ''}
                        </div>
                        <button class="download-btn" onclick="downloadSpecific('${product.name}')">
                            📥 查看详细信息
                        </button>
                    </div>
                `;
            });
            
            html += '</div>';
            html += `
                <div style="text-align: center; margin-top: 30px;">
                    <button class="download-btn" onclick="showCatalogDetails()">
                        📥 查看完整标准目录Excel
                    </button>
                </div>
            `;
            
            resultContainer.innerHTML = html;
        }

        // 显示目录详情
        function showCatalogDetails() {
            alert('绿色食品产品适用标准目录（2023版）\n\n在实际部署中，这里会显示完整的Excel目录内容');
            // 实际部署时替换为显示完整目录的模态框或页面
        }

        // 显示错误信息
        function showError(message) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `
                <div class="error-message">
                    ⚠️ ${message}
                </div>
            `;
        }

        // 下载特定产品信息
        function downloadSpecific(productName) {
            alert(`下载功能：${productName}的详细信息\n\n在实际部署中，这里会显示该产品的详细标准信息`);
        }

        // 初始化搜索框焦点
        document.getElementById('searchInput').focus();
    </script>
</body>
</html>
