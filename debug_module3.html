<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模块三调试页面</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-case { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>模块三"查看规程参考"链接调试</h1>
    
    <div class="test-case">
        <h2>测试1: 直接链接访问</h2>
        <a href="http://www.greenfood.agri.cn/ywzn/lssp/txbz/scczgc/" target="_blank">
            点击这里测试直接访问
        </a>
        <p>如果这个链接能打开，说明链接本身是正确的</p>
    </div>
    
    <div class="test-case">
        <h2>测试2: JavaScript生成的链接</h2>
        <button onclick="testGeneratedLink()">测试JavaScript生成的链接</button>
        <div id="testResult"></div>
    </div>
    
    <div class="test-case">
        <h2>测试3: 模拟模块三的代码</h2>
        <button onclick="simulateModule3()">模拟模块三的链接生成</button>
        <div id="simulationResult"></div>
    </div>
    
    <script>
        const downloadLinks = {
            procedureGuide: {
                url: "http://www.greenfood.agri.cn/ywzn/lssp/txbz/scczgc/"
            }
        };
        
        function testGeneratedLink() {
            const testDiv = document.getElementById('testResult');
            const link = downloadLinks.procedureGuide.url;
            
            testDiv.innerHTML = `
                <p>生成的链接: ${link}</p>
                <a href="${link}" target="_blank">点击测试生成的链接</a>
                <p>如果这个链接能工作，说明JavaScript代码是正确的</p>
            `;
        }
        
        function simulateModule3() {
            const simulationDiv = document.getElementById('simulationResult');
            const item = "质量控制规范"; // 模拟包含"规程"的文字
            
            let html = `<div><strong>模拟项: ${item}</strong>`;
            
            // 这是模块三中的实际代码
            if (item.includes('规程')) {
                html += `<br><a href="${downloadLinks.procedureGuide.url}" target="_blank" style="background: #4caf50; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px;">查看规程参考</a>`;
            }
            
            html += '</div>';
            simulationDiv.innerHTML = html;
        }
    </script>
</body>
</html>
