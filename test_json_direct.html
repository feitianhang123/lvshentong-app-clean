<!DOCTYPE html>
<html>
<head>
    <title>JSON直接加载测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .loading { color: orange; }
    </style>
</head>
<body>
    <h1>JSON直接加载测试</h1>
    <button onclick="testJSON()">测试JSON加载</button>
    <div id="result"></div>
    
    <script>
        async function testJSON() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">正在加载JSON数据...</div>';
            
            try {
                const response = await fetch('complete_excel.json');
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const data = await response.json();
                resultDiv.innerHTML = `<div class="success">
                    ✅ JSON加载成功！<br>
                    共 ${data.length} 行数据<br>
                    第一行: ${JSON.stringify(data[0])}
                </div>`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">
                    ❌ JSON加载失败<br>
                    错误: ${error.message}<br>
                    请检查文件路径和网络连接
                </div>`;
            }
        }
    </script>
</body>
</html>
