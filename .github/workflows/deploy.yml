name: Deploy Green Food App

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm install -g http-server
    
    - name: Validate HTML
      run: |
        echo "Validating HTML files..."
        # 检查HTML语法
        if ! npx html-validate *.html; then
          echo "HTML validation completed"
        fi
    
    - name: Check JavaScript syntax
      run: |
        echo "Checking JavaScript files..."
        # 检查JS语法
        if [ -f "module1_final.js" ]; then
          npx eslint module1_final.js --no-eslintrc --env browser || true
        fi
        if [ -f "module1_complete_fix.js" ]; then
          npx eslint module1_complete_fix.js --no-eslintrc --env browser || true
        fi
    
    - name: Create deployment package
      run: |
        echo "Creating deployment package..."
        mkdir -p deploy
        # 复制主要文件
        cp *.html deploy/ 2>/dev/null || true
        cp *.js deploy/ 2>/dev/null || true
        cp *.json deploy/ 2>/dev/null || true
        
        # 创建版本信息
        echo "Build date: $(date)" > deploy/build-info.txt
        echo "Commit: ${{ github.sha }}" >> deploy/build-info.txt
    
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: green-food-app
        path: deploy/
        retention-days: 7
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        keep_files: true