name: Android APK Build

on:
  push:
    branches: [ master ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      releaseType:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Copy HTML to assets
      run: |
        echo "Copying latest HTML files to android-project assets..."
        cp module1-complete.html android-project/app/src/main/assets/www/
        cp module2_current_standards.html android-project/app/src/main/assets/www/
        cp module3_final.html android-project/app/src/main/assets/www/
        echo "HTML files copied successfully"
    
    - name: Build Debug APK
      if: github.event.inputs.releaseType == 'debug' || github.event_name == 'workflow_dispatch'
      run: |
        cd android-project
        chmod +x ./gradlew
        ./gradlew assembleDebug
        
    - name: Build Release APK
      if: github.event.inputs.releaseType == 'release' || github.event_name == 'release'
      run: |
        cd android-project
        chmod +x ./gradlew
        ./gradlew assembleRelease
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: green-food-app-apk
        path: android-project/app/build/outputs/apk/
        retention-days: 30
        
    - name: List APK Files
      run: |
        find android-project/app/build/outputs/apk/ -name "*.apk" -exec ls -la {} \;