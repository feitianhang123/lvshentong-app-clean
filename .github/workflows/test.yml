name: Test Green Food App

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Run basic tests
      run: |
        echo "Running basic validation tests..."
        
        # 检查必要文件是否存在
        if [ ! -f "module1-complete.html" ]; then
          echo "❌ ERROR: module1-complete.html not found"
          exit 1
        fi
        
        if [ ! -f "绿色食品产品适用标准目录（2023版）.xlsx" ]; then
          echo "⚠️ WARNING: Excel file not found (expected for deployment)"
        fi
        
        # 检查HTML文件基本结构
        if grep -q "<!DOCTYPE html>" module1-complete.html; then
          echo "✅ HTML doctype found"
        else
          echo "❌ HTML doctype missing"
          exit 1
        fi
        
        if grep -q "绿色食品" module1-complete.html; then
          echo "✅ Green food text found"
        else
          echo "❌ Green food text missing"
          exit 1
        fi
        
        echo "✅ All basic tests passed!"
    
    - name: Test deployment readiness
      run: |
        echo "Checking deployment readiness..."
        
        # 统计文件数量
        html_count=$(ls *.html 2>/dev/null | wc -l)
        js_count=$(ls *.js 2>/dev/null | wc -l)
        
        echo "Found $html_count HTML files and $js_count JS files"
        
        if [ $html_count -eq 0 ]; then
          echo "❌ No HTML files found"
          exit 1
        fi
        
        echo "✅ Deployment ready check passed"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check HTML validity
      uses: actionshub/htmlproofer@main
      with:
        directory: .
        arguments: --check-html --allow-hash-href --empty-alt-ignore